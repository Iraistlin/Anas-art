<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#f6ebe4"/>
<ellipse cx="450" cy="360" rx="220" ry="160" fill="#f7e7c8" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="450" cy="780" rx="260" ry="200" fill="#e7d3cc" opacity="0.7" filter="url(#soft)"/>
<ellipse cx="250" cy="600" rx="80" ry="140" fill="#d5e3e4" opacity="0.55" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
