<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="1100" fill="#f6e4dc"/>
<ellipse cx="400" cy="420" rx="220" ry="260" fill="#e7b7b4" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="520" cy="640" rx="140" ry="160" fill="#f3d5cf" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="300" cy="700" rx="90" ry="120" fill="#c9d5c4" opacity="0.6" filter="url(#soft)"/>
  <rect width="800" height="1100" filter="url(#grain)" opacity="0.16"/>
</svg>
