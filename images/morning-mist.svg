<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e6de"/>
      <stop offset="0.5" stop-color="#f3ddd0"/>
      <stop offset="1" stop-color="#e4eef0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#sky)"/>
  <ellipse cx="1180" cy="250" rx="240" ry="110" fill="#f6e2b8" opacity="0.7" filter="url(#soft)"/>
  <circle cx="1220" cy="230" r="46" fill="#f0d29a"/>
  <ellipse cx="280" cy="520" rx="90" ry="150" fill="#b7c7b0" opacity="0.7" filter="url(#soft)"/>
  <ellipse cx="430" cy="500" rx="70" ry="170" fill="#9aaf98" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="560" cy="540" rx="60" ry="120" fill="#c5d3c2" opacity="0.7" filter="url(#soft)"/>
  <path d="M0 620 C 280 560, 520 700, 820 620 C 1100 548, 1320 680, 1600 600 V 1100 H 0 Z" fill="#d5e4e6"/>
  <path d="M0 760 C 360 700, 700 840, 1080 760 C 1320 710, 1480 800, 1600 760 V 1100 H 0 Z" fill="#b7cdd2" opacity="0.9"/>
  <path d="M0 920 C 400 860, 900 980, 1600 900 V 1100 H 0 Z" fill="#9bb6bc" opacity="0.75"/>
  <path d="M240 690 C 520 650, 760 730, 1040 680" fill="none" stroke="#f4e7cf" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M80 470 C 140 390, 150 300, 120 230" fill="none" stroke="#7f947c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M120 320 C 90 300, 70 250, 90 220" fill="none" stroke="#7f947c" stroke-width="2" stroke-linecap="round"/>
  <rect width="1600" height="1100" filter="url(#grain)" opacity="0.18"/>
</svg>
