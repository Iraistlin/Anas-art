<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#e7eef0"/>
<ellipse cx="620" cy="280" rx="180" ry="90" fill="#f6e2c4" opacity="0.85" filter="url(#soft)"/>
<ellipse cx="250" cy="520" rx="160" ry="220" fill="#b7c7b0" opacity="0.55" filter="url(#soft)"/>
<ellipse cx="450" cy="780" rx="320" ry="180" fill="#c5d6dc" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="700" cy="980" rx="260" ry="140" fill="#a9c0c6" opacity="0.55" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
