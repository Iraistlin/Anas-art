<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="24"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="1100" fill="#e7eef1"/>
<ellipse cx="400" cy="360" rx="240" ry="180" fill="#f6e6dc" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="400" cy="780" rx="280" ry="160" fill="#c5d5d8" opacity="0.7" filter="url(#soft)"/>
<ellipse cx="560" cy="240" rx="80" ry="50" fill="#f3e2b8" opacity="0.8" filter="url(#soft)"/>
  <rect width="800" height="1100" filter="url(#grain)" opacity="0.16"/>
</svg>
