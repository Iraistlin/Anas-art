    </filter>
  </defs>
  <rect width="900" height="1200" fill="#f6f1e8"/>
  <path d="M160 220 C 300 120, 560 150, 700 280 C 860 430, 800 700, 640 820 C 470 950, 220 980, 150 820 C 70 640, 40 360, 160 220 Z" fill="#8eaa86" opacity="0.85" filter="url(#soft)"/>
  <path d="M250 300 C 390 240, 540 340, 560 500 C 580 680, 440 800, 320 760 C 200 720, 170 520, 230 400 C 250 340, 200 320, 250 300 Z" fill="#6e846c" opacity="0.75"/>
  <ellipse cx="430" cy="520" rx="90" ry="120" fill="#e7cfc6" opacity="0.75" filter="url(#soft)"/>
  <path d="M180 900 C 320 820, 560 900, 740 780" fill="none" stroke="#c4a574" stroke-width="6" stroke-linecap="round"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.14"/>
