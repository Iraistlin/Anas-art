<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dccf"/>
      <stop offset="1" stop-color="#f3e7da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1100" height="1100" fill="url(#sky)"/>
  <circle cx="820" cy="230" r="54" fill="#f2d7a4" opacity="0.95"/>
