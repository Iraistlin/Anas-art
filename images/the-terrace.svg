  <circle cx="300" cy="790" r="72" fill="#8faa86" opacity="0.9" filter="url(#soft)"/>
  <circle cx="262" cy="770" r="34" fill="#b7c9a8"/>
  <rect x="292" y="848" width="14" height="64" rx="6" fill="#a08a72"/>
