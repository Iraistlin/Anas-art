<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#f6e3d6"/>
<ellipse cx="680" cy="240" rx="120" ry="60" fill="#f2d7a4" opacity="0.9" filter="url(#soft)"/>
<ellipse cx="300" cy="780" rx="140" ry="160" fill="#8faa86" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="450" cy="980" rx="400" ry="140" fill="#e7d7c8" opacity="0.85" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
