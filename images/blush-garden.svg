<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1300" fill="#f6efe8"/>
  <ellipse cx="500" cy="620" rx="280" ry="340" fill="#f3ddd4" opacity="0.8" filter="url(#soft)"/>
  <ellipse cx="390" cy="560" rx="120" ry="150" fill="#e7b7b2" opacity="0.85" filter="url(#soft)"/>
  <ellipse cx="560" cy="500" rx="140" ry="160" fill="#efc9c0" opacity="0.9" filter="url(#soft)"/>
  <ellipse cx="500" cy="700" rx="150" ry="130" fill="#dd9e9e" opacity="0.7" filter="url(#soft)"/>
  <ellipse cx="640" cy="680" rx="90" ry="110" fill="#f6d7cf" filter="url(#soft)"/>
  <ellipse cx="300" cy="860" rx="70" ry="36" fill="#a9bea4" transform="rotate(-24 300 860)"/>
  <ellipse cx="700" cy="420" rx="64" ry="30" fill="#8eaa8c" transform="rotate(30 700 420)"/>
  <ellipse cx="250" cy="500" rx="58" ry="26" fill="#b7c9ae" transform="rotate(-40 250 500)"/>
  <circle cx="470" cy="590" r="10" fill="#e6d2a2"/>
