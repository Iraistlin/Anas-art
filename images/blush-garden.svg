  <path d="M500 980 C 490 860, 520 760, 500 680" fill="none" stroke="#7d946f" stroke-width="3" stroke-linecap="round"/>
  <rect width="1000" height="1300" filter="url(#grain)" opacity="0.16"/>
</svg>
