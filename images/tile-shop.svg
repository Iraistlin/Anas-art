<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="1100" fill="#f8ece8"/>
<ellipse cx="400" cy="480" rx="180" ry="200" fill="#e7a8ad" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="280" cy="620" rx="100" ry="110" fill="#f3c9c6" opacity="0.85" filter="url(#soft)"/>
<ellipse cx="530" cy="400" rx="90" ry="100" fill="#f6dfe0" opacity="0.9" filter="url(#soft)"/>
  <rect width="800" height="1100" filter="url(#grain)" opacity="0.16"/>
</svg>
