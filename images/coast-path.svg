<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#e7eef0"/>
<ellipse cx="450" cy="420" rx="400" ry="160" fill="#d7c6b4" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="450" cy="760" rx="460" ry="240" fill="#b7ccc8" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="200" cy="200" rx="180" ry="70" fill="#f6e4dc" opacity="0.6" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
