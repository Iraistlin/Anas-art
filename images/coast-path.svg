<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4eef1"/>
      <stop offset="1" stop-color="#efe6dc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1700" height="900" fill="url(#sky)"/>
  <ellipse cx="400" cy="180" rx="260" ry="70" fill="#f6e4dc" opacity="0.7" filter="url(#soft)"/>
  <path d="M0 380 C 420 320, 900 460, 1700 340 V 900 H 0 Z" fill="#c5d5d4"/>
  <path d="M0 540 C 500 480, 1000 620, 1700 520 V 900 H 0 Z" fill="#a9c0c4" opacity="0.75"/>
  <path d="M0 470 C 280 430, 460 560, 780 500 C 1080 446, 1300 560, 1700 470 V 700 C 1200 760, 700 620, 0 700 Z" fill="#eadcc8"/>
  <path d="M40 630 C 300 590, 560 710, 900 650 C 1180 600, 1460 700, 1680 640" fill="none" stroke="#c4a574" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <rect width="1700" height="900" filter="url(#grain)" opacity="0.15"/>
</svg>
