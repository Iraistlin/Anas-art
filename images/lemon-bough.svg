<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#f7f1e8"/>
<ellipse cx="450" cy="560" rx="200" ry="120" fill="#f3e4d4" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="340" cy="640" rx="70" ry="48" fill="#f0d56a" opacity="0.95" filter="url(#soft)"/>
<ellipse cx="560" cy="600" rx="78" ry="54" fill="#e7c84e" opacity="0.95" filter="url(#soft)"/>
<ellipse cx="420" cy="480" rx="90" ry="36" fill="#9db596" opacity="0.8" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
