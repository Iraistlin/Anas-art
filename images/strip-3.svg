<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="33"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="640" height="900" fill="#f6efe8"/>
<ellipse cx="180" cy="360" rx="70" ry="50" fill="#f0d56a" opacity="0.9" filter="url(#soft)"/>
<ellipse cx="120" cy="300" rx="50" ry="24" fill="#9db596" opacity="0.8" filter="url(#soft)"/>
  <rect width="640" height="900" filter="url(#grain)" opacity="0.16"/>
</svg>
