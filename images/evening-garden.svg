<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="15"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#f3ddd4"/>
<ellipse cx="700" cy="220" rx="140" ry="80" fill="#f0c98a" opacity="0.7" filter="url(#soft)"/>
<ellipse cx="280" cy="640" rx="180" ry="240" fill="#7f9a78" opacity="0.6" filter="url(#soft)"/>
<ellipse cx="560" cy="860" rx="200" ry="180" fill="#c4b0a4" opacity="0.55" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
