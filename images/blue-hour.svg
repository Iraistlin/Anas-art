<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5e4ea"/>
      <stop offset="0.55" stop-color="#c3d5de"/>
      <stop offset="1" stop-color="#e7e3da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1500" height="1080" fill="url(#sky)"/>
  <ellipse cx="1120" cy="220" rx="180" ry="70" fill="#f3e6c8" opacity="0.7" filter="url(#soft)"/>
  <circle cx="1140" cy="210" r="28" fill="#f0d7a6"/>
  <path d="M0 560 C 260 500, 480 640, 760 560 C 1040 480, 1260 600, 1500 520 V 760 H 0 Z" fill="#b7c9b4" opacity="0.85"/>
  <path d="M0 640 C 400 700, 900 560, 1500 660 V 1080 H 0 Z" fill="#c5d6dc"/>
  <path d="M0 820 C 500 760, 980 900, 1500 800 V 1080 H 0 Z" fill="#a9c0c8" opacity="0.8"/>
  <path d="M180 760 C 460 720, 700 800, 980 740" fill="none" stroke="#f4e7cf" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <rect width="1500" height="1080" filter="url(#grain)" opacity="0.16"/>
</svg>
