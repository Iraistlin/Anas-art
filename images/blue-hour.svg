<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#d5e3ea"/>
<ellipse cx="640" cy="260" rx="160" ry="70" fill="#f3e6c8" opacity="0.75" filter="url(#soft)"/>
<ellipse cx="450" cy="620" rx="380" ry="120" fill="#b7c9b4" opacity="0.7" filter="url(#soft)"/>
<ellipse cx="450" cy="860" rx="420" ry="200" fill="#a9c0c8" opacity="0.75" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
