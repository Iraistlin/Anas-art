<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1200" fill="#f8e7e4"/>
<ellipse cx="320" cy="420" rx="130" ry="150" fill="#e7a3a8" opacity="0.8" filter="url(#soft)"/>
<ellipse cx="520" cy="520" rx="150" ry="170" fill="#f0c2c0" opacity="0.85" filter="url(#soft)"/>
<ellipse cx="430" cy="700" rx="110" ry="120" fill="#d98990" opacity="0.65" filter="url(#soft)"/>
<ellipse cx="600" cy="360" rx="70" ry="80" fill="#f6d5d2" opacity="0.9" filter="url(#soft)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
